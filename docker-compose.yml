services:
  postgres:
    image: postgres:16-alpine
    container_name: webviewer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webviewer
      POSTGRES_PASSWORD: webviewer_dev_password
      POSTGRES_DB: webviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webviewer"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: webviewer-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: webviewer
      MINIO_ROOT_PASSWORD: webviewer_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    container_name: webviewer-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 webviewer webviewer_dev_password;
      mc mb -p local/feedback-uploads || true;
      mc anonymous set download local/feedback-uploads;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
